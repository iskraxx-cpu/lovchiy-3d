<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #0d1620; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #ui { position: fixed; left: 16px; top: 16px; z-index: 10; background: rgba(16,26,36,.88);

  .grp > .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 1.1px; color: #8b98a4; margin-bottom: 6px; }
  button { font-family: inherit; font-size: 11.5px; color: #cfd9e2; background: #1b2a38;
    border: 1px solid #2f4356; border-radius: 6px; padding: 6px 9px; cursor: pointer; margin: 0 4px 4px 0; }
  button:hover { background: #24384a; color: #fff; }
  button.on { background: #d64517; border-color: #d64517; color: #fff; }
  button.go { background: #d64517; border-color: #d64517; color: #fff; width: 100%; margin: 0; padding: 8px; font-size: 12px; }
  #hud { position: fixed; right: 16px; bottom: 16px; z-index: 10; text-align: right;
    font-size: 11px; color: #8b98a4; line-height: 1.7; }
  #hud b { color: #cfd9e2; font-size: 12px; }
  #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10;
    font-size: 11px; color: #6f7d8a; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #ff9a7a;
    font-size: 14px; text-align: center; padding: 40px; z-index: 20; }
  #arnote { position: fixed; left: 50%; top: 18px; transform: translateX(-50%); z-index: 30;
    background: rgba(16,26,36,.92); border: 1px solid #2b3d4d; border-radius: 8px;
    padding: 10px 14px; font-size: 12px; color: #cfd9e2; display: none; text-align: center; max-width: 88vw; }
  .hdr { display: none; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
  .hdr-t { min-width: 0; }
  .nums { font-size: 10.5px; color: #8b98a4; line-height: 1.45; margin-top: 3px; }
  .hdr-b { flex: none; display: flex; gap: 6px; }
  .hdr-b button { margin: 0; padding: 7px 11px; }
  #ui.hidden { display: none; }
  #b-show { position: fixed; left: 6px; bottom: 6px; z-index: 10; display: none; margin: 0;
    padding: 9px 14px; font-size: 12.5px; background: rgba(16,26,36,.88); border-color: #2b3d4d; border-radius: 10px; }
  #b-show.on { display: block; }
  @media (max-width: 760px) {
    #ui { left: 6px; right: 6px; top: auto; bottom: 6px; width: auto; padding: 10px 12px;

    #ui h1 { font-size: 13px; }
    #ui .sub { display: none; }
    #hud { display: none; }
    #hint { display: none; }
    .hdr { display: flex; }
    #ui.mini { max-height: none; overflow: visible; }
    #ui.mini .grp-el, #ui.mini .grp-cam { display: none; }
    #ui.mini .grp { margin-bottom: 9px; }

    .grp > .lbl { margin-bottom: 5px; }

    });

    netGeo = new THREE.PlaneGeometry(S.L, S.W, 96, 56);
    net = new THREE.Mesh(netGeo, netMaterial(S.L, S.W));
    net.rotation.x = -Math.PI / 2; net.renderOrder = 2;
    gNet.add(net);
    updateNet();

    if (S.tier2) {
      const g2 = new THREE.PlaneGeometry(S.L, S.W, 64, 40);
      const p = g2.attributes.position;
      for (let i = 0; i < p.count; i++) {
        const u = p.getX(i) / (S.L / 2), v = p.getY(i) / (S.W / 2);
        p.setZ(i, -S.SAG * 0.8 * (1 - u * u) * (1 - v * v));
      }
      g2.computeVertexNormals();
      const n2 = new THREE.Mesh(g2, netMaterial(S.L, S.W));
      n2.rotation.x = -Math.PI / 2; n2.position.y = S.HM - 9; n2.renderOrder = 2;
      gNet.add(n2);
    }

    if (S.sides) {
      const H = S.HM - 4;
      [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(function (s) {
        const len = s[0] !== 0 ? S.W : S.L;
        const m = new THREE.Mesh(new THREE.PlaneGeometry(len, H, 40, 12), netMaterial(len, H));
        m.renderOrder = 2;
        m.position.set(s[0] * S.L / 2, S.HM - H / 2, s[1] * S.W / 2);
        if (s[0] !== 0) m.rotation.y = Math.PI / 2;
        gSide.add(m);
      });
    }
    buildRopes();
  }

  const drone = new THREE.Group();
  {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.32, 3.4, 12), steelDark);
    body.rotation.z = Math.PI / 2; body.castShadow = true;
    const wing = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.12, 6.4), steelDark); wing.castShadow = true;
    const tail = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.1), steelDark); tail.position.set(-1.5, 0.5, 0);
    drone.add(body, wing, tail);
  }
  drone.visible = false; world.add(drone);

  const target = new THREE.Vector3(0, 12, 0);
  let rad = 160, theta = -0.72, phi = 1.02;
  function camPresets() {
    const d = Math.max(S.L, S.W) * (S.camK || 1);
    const t0 = (S.camT !== undefined) ? S.camT : -0.72;
    return [
      { rad: d * 1.72, theta: t0, phi: (S.camP || 1.02), ty: S.HM * (S.camY || 0.44) },
      { rad: d * 1.40, theta: -2.35, phi: 1.16, ty: S.HM * 0.34 },
      { rad: d * 0.62, theta: -1.10, phi: 1.46, ty: S.HM * 0.14 },
      { rad: d * 1.62, theta: -0.90, phi: 0.42, ty: S.HM * 0.28 },
    ];
  }
  function applyCam() {
    camera.position.set(
      target.x + rad * Math.sin(phi) * Math.cos(theta),
      target.y + rad * Math.cos(phi),
      target.z + rad * Math.sin(phi) * Math.sin(theta));
    camera.lookAt(target);
  }
  let radBase = 160;
  function fitK() {                      // поправка на пропорции экрана
    const a = innerWidth / innerHeight;
    return a < 1.4 ? Math.min(1.95, 1.4 / a) : 1;
  }
  function setCam(i) {
    const c = camPresets()[i];
    radBase = c.rad; rad = radBase * fitK();
    theta = c.theta; phi = c.phi; target.set(0, c.ty, 0); applyCam();
  }

  let drag = null;
  const el = renderer.domElement;
  el.addEventListener('pointerdown', function (e) { drag = { x: e.clientX, y: e.clientY, b: e.button }; el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointerup', function () { drag = null; });
  el.addEventListener('pointermove', function (e) {
    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    drag.x = e.clientX; drag.y = e.clientY;
    if (drag.b === 2) { target.x -= dx * 0.12; target.z -= dy * 0.12; }
    else { theta -= dx * 0.005; phi = Math.max(0.12, Math.min(1.52, phi - dy * 0.004)); }
    applyCam();
  });
  el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  let pinch = 0;
  el.addEventListener('touchmove', function (e) {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX,
                         e.touches[0].clientY - e.touches[1].clientY);
    if (pinch) { rad = Math.max(30, Math.min(800, rad * (pinch / d))); radBase = rad / fitK(); applyCam(); }
    pinch = d;
  }, { passive: false });
  el.addEventListener('touchend', function () { pinch = 0; });
  el.addEventListener('wheel', function (e) {
    e.preventDefault();
    rad = Math.max(30, Math.min(800, rad * (1 + Math.sign(e.deltaY) * 0.09)));
    radBase = rad / fitK(); applyCam();
  }, { passive: false });

  function syncUI() {
    document.getElementById('ttl').textContent = S.title;
    document.getElementById('stl').textContent = S.sub;
    document.getElementById('h1').textContent = 'пролёт ' + S.L + ' × ' + S.W + ' м · мачты ' + S.HM + ' м';
    document.getElementById('h2').textContent = S.note;
    numsLine();
    document.querySelectorAll('[data-s]').forEach(function (b) { b.classList.toggle('on', b.dataset.s === KEY); });
    document.getElementById('b-play').style.display = (S.incline || S.vertical) ? 'none' : '';
  }
  function goScenario(k) {
    if (!SCEN[k]) return;
    KEY = k; S = SCEN[k]; anim = null; drone.visible = false;
    build(); syncUI(); setCam(0);
  }
  document.querySelectorAll('[data-s]').forEach(function (b) {
    b.addEventListener('click', function () { goScenario(b.dataset.s); });
  });
  document.querySelectorAll('[data-cam]').forEach(function (b) {
    b.addEventListener('click', function () { setCam(+b.dataset.cam); });
  });
  [['b-net', gNet], ['b-rope', gRope], ['b-side', gSide], ['b-guy', gGuy]].forEach(function (pair) {
    const b = document.getElementById(pair[0]), g = pair[1];
    b.addEventListener('click', function () { g.visible = !g.visible; b.classList.toggle('on', g.visible); });
  });

  const statEl = document.getElementById('stat');
  const numsEl = document.getElementById('pnums');
  function numsLine() {
    numsEl.textContent = 'пролёт ' + S.L + ' × ' + S.W + ' м · мачты ' + S.HM + ' м · ' + statEl.textContent;
  }

  // ── свёрнутая панель на узком экране
  const uiEl = document.getElementById('ui');
  const togEl = document.getElementById('b-toggle');
  function setMini(on) {
    uiEl.classList.toggle('mini', on);
    togEl.textContent = on ? 'Настройки' : 'Свернуть';
  }
  setMini(innerWidth <= 760);
  togEl.addEventListener('click', function () { setMini(!uiEl.classList.contains('mini')); });
  addEventListener('resize', function () { if (innerWidth > 760) uiEl.classList.remove('mini'); });
  // ── панель можно спрятать целиком: остаётся плашка с кодом решения
  const showEl = document.getElementById('b-show');
  function setHidden(on) {
    uiEl.classList.toggle('hidden', on);
    showEl.classList.toggle('on', on);
    showEl.textContent = S.title.split(' · ')[0] + ' · панель';
  }
  document.getElementById('b-hide').addEventListener('click', function () { setHidden(true); });
  showEl.addEventListener('click', function () { setHidden(false); });

  let anim = null;
  document.getElementById('b-play').addEventListener('click', function () { anim = { t: 0 }; drone.visible = true; });

  function tick(dt) {
    if (!anim) return;
    const t = (anim.t += dt);
    if (t < 1.6) {
      const k = t / 1.6;
      drone.position.set(-S.L * 1.7 + k * S.L * 1.62, S.HM * 2.1 - k * S.HM * 0.85, S.W * 0.8 - k * S.W * 0.9);
      drone.rotation.y = -0.3; dent = 0;
    } else if (t < 2.6) {
      const k = (t - 1.6) / 1.0; dent = S.SAG * 1.35 * (1 - Math.pow(1 - k, 3));
    } else if (t < 4.4) {
      const k = (t - 2.6) / 1.8;
      dent = S.SAG * 1.35 * (0.55 + 0.45 * Math.cos(k * 9)) * Math.exp(-k * 1.7) + S.SAG * 0.4 * (1 - Math.exp(-k * 3));
    } else {
      dent = S.SAG * 0.4; if (t > 7) anim = null;
    }
    if (t >= 1.6) drone.position.set(dentX * S.L / 2, sagY(dentX, dentZ) + 0.9, dentZ * S.W / 2);
    updateNet(); buildRopes();
    statEl.textContent = 'прогиб ' + dent.toFixed(1).replace('.', ',') + ' м';
    numsLine();
  }

  function resize() {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    rad = radBase * fitK(); applyCam();
  }
  addEventListener('resize', resize);

  build(); syncUI(); resize(); setCam(0); window.__built = true;

  let last = performance.now();
  renderer.setAnimationLoop(function (now, frame) {
    const dt = Math.min(0.05, ((now || performance.now()) - last) / 1000);
    last = now || performance.now();
    tick(dt);
    if (AR.onFrame) AR.onFrame(frame);
    renderer.render(scene, camera);
  });

  // ══ дополненная реальность (WebXR) ══
  const AR = {};
  (function () {
    const btn = document.getElementById('b-ar');
    const note = document.getElementById('arnote');
    const SCALE = 1 / 220;                       // пролёт 92 м → около 42 см на столе
    let session = null, refSpace = null, hitSrc = null, placed = false;
    const savedFog = scene.fog;
    const hiddenList = [];

    const ring = new THREE.Mesh(
      new THREE.RingGeometry(0.06, 0.085, 32).rotateX(-Math.PI / 2),
      new THREE.MeshBasicMaterial({ color: 0xd64517, toneMapped: false }));
    ring.visible = false; ring.matrixAutoUpdate = false; scene.add(ring);

    function say(t) { note.textContent = t; note.style.display = t ? 'block' : 'none'; }

    function enterVisual() {
      scene.fog = null;
      scene.children.forEach(function (c) {
        if (c === world || c === ring || c.isLight) return;
        if (c.visible) { hiddenList.push(c); c.visible = false; }
      });
      world.visible = false;
      world.scale.setScalar(SCALE);
      document.getElementById('hud').style.display = 'none';
    }
    function exitVisual() {
      scene.fog = savedFog;
      hiddenList.forEach(function (c) { c.visible = true; });
      hiddenList.length = 0;
      world.visible = true;
      world.scale.setScalar(1);
      world.position.set(0, 0, 0);
      ring.visible = false; placed = false;
      say('');
      btn.textContent = 'Показать в дополненной реальности';
      renderer.xr.enabled = false;
      document.getElementById('hud').style.display = '';
      resize(); applyCam();
    }

    AR.onFrame = function (frame) {
      if (!frame || !hitSrc || !refSpace || placed) return;
      const hits = frame.getHitTestResults(hitSrc);
      if (hits.length) {
        ring.visible = true;
        ring.matrix.fromArray(hits[0].getPose(refSpace).transform.matrix);
      } else ring.visible = false;
    };

    if (!navigator.xr || !navigator.xr.isSessionSupported) return;
    navigator.xr.isSessionSupported('immersive-ar').then(function (ok) {
      if (!ok) return;
      btn.style.display = '';
      btn.addEventListener('click', function () {
        if (session) { session.end(); return; }
        navigator.xr.requestSession('immersive-ar', {
          requiredFeatures: ['hit-test'],
          optionalFeatures: ['dom-overlay'],
          domOverlay: { root: document.body },
        }).then(function (sess) {
          session = sess;
          btn.textContent = 'Выйти из AR';
          say('Наведите камеру на пол или стол, затем коснитесь экрана');
          enterVisual();
          renderer.xr.enabled = true;
          renderer.xr.setReferenceSpaceType('local');
          renderer.xr.setSession(sess);
          sess.requestReferenceSpace('viewer').then(function (vs) {
            return sess.requestHitTestSource({ space: vs });
          }).then(function (src) { hitSrc = src; });
          sess.requestReferenceSpace('local').then(function (rs) { refSpace = rs; });
          sess.addEventListener('select', function () {
            if (!ring.visible) return;
            world.position.setFromMatrixPosition(ring.matrix);
            world.visible = true; placed = true; ring.visible = false;
            say('Масштаб 1:220 · обойдите модель вокруг');
          });
          sess.addEventListener('end', function () {
            session = null; hitSrc = null; refSpace = null; exitVisual();
          });
        }).catch(function () {
          say('Не удалось запустить AR на этом устройстве');
          setTimeout(function () { say(''); }, 3500);
        });
      });
    });
  })();

  window.__scene = {
    camera: camera, renderer: renderer, scene: scene, drone: drone, world: world,
    setCam: setCam, setScenario: goScenario,
    setDent: function (d) { dent = d; updateNet(); buildRopes(); },
    dronePark: function () {
      drone.position.set(dentX * S.L / 2, sagY(dentX, dentZ) + 0.9, dentZ * S.W / 2);
      drone.rotation.y = -0.3;
    },
    cfg: function () { return S; },
  };
  window.__ready = true;
})();
</script>
